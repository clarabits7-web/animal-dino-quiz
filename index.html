<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="동물 퀴즈" />
  <meta name="theme-color" content="#0d1b2a" />
  <title>신비한 동물 퀴즈 대모험 · 진짜 vs 가짜!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- 초간단 헤더 -->
    <header class="app-header">
      <div class="header-brand">
        <span class="logo-emoji">🦖</span>
        <h1 class="logo-text">신비한 동물 탐험대</h1>
        <span id="questionCounter" class="pill-counter">1 / 25</span>
      </div>
      <div class="header-actions">
        <span id="scoreBadge" class="score-badge">⭐ 0개 맞춤</span>
        <button type="button" id="soundToggleBtn" class="mini-btn" title="소리 켜기/끄기">🔊</button>
        <button type="button" id="shuffleBtn" class="mini-btn" title="문제 섞기">🔀 섞기</button>
      </div>
    </header>

    <!-- 모드 선택 탭 (딱 2개!) -->
    <nav class="mode-tabs">
      <button type="button" id="modeRealFakeBtn" class="mode-pill active">
        🕵️ 진짜 vs 가짜 맞추기
      </button>
      <button type="button" id="modeWhoAmIBtn" class="mode-pill">
        🔍 이름 맞추기 (누구일까?)
      </button>
    </nav>

    <!-- 메인 퀴즈 카드 -->
    <main class="quiz-card" id="quizCard">
      <!-- 1. 사진 표시 영역 (화면 중앙에 크고 시원하게 100% 바로 노출!) -->
      <div class="photo-stage">
        <!-- 로딩 표시 -->
        <div id="photoSkeleton" class="photo-skeleton hidden">
          <span class="skeleton-icon">🔍</span>
          <span>동물 사진 불러오는 중...</span>
        </div>

        <!-- 실존 동물 단독 사진 -->
        <div id="singlePhotoWrapper" class="single-photo-box">
          <img id="mainCreatureImg" class="main-photo" src="" alt="동물 사진" />
        </div>

        <!-- 가짜(합성) 동물 듀얼 비교 사진 -->
        <div id="hybridPhotoWrapper" class="hybrid-photo-box hidden">
          <div class="hybrid-items-row">
            <div class="hybrid-col">
              <img id="hybridImg1" class="hybrid-thumb" src="" alt="합성 동물 1" />
              <span id="hybridPart1" class="hybrid-label">상어 머리 🦈</span>
            </div>
            <span class="hybrid-plus-mark">➕</span>
            <div class="hybrid-col">
              <img id="hybridImg2" class="hybrid-thumb" src="" alt="합성 동물 2" />
              <span id="hybridPart2" class="hybrid-label">말 다리 🐎</span>
            </div>
          </div>
          <div id="hybridTitle" class="hybrid-caption">샤크호스 (상어말)</div>
        </div>
      </div>

      <!-- 2. 문제 질문 및 힌트 텍스트 -->
      <div class="question-info">
        <h2 id="questionPrompt" class="question-title">이 동물은 세상에 진짜 있을까요?</h2>
        <p id="questionHint" class="question-sub">오리 주둥이에 알을 낳고 뒷발에 독침이 있대요!</p>
      </div>

      <!-- 3-A. [진짜 vs 가짜 모드] 큼직한 O / X 터치 버튼 2개 -->
      <div id="realFakeButtonGroup" class="big-buttons-grid">
        <button type="button" id="btnVoteReal" class="btn-vote btn-vote-real">
          <span class="vote-icon">⭕</span>
          <div class="vote-copy">
            <strong>진짜 있어요!</strong>
            <small>지구에 사는 진짜 생물</small>
          </div>
        </button>

        <button type="button" id="btnVoteFake" class="btn-vote btn-vote-fake">
          <span class="vote-icon">❌</span>
          <div class="vote-copy">
            <strong>가짜예요!</strong>
            <small>합성 · 상상의 생물</small>
          </div>
        </button>
      </div>

      <!-- 3-B. [이름 맞추기 모드] 4지선다 보기 버튼 -->
      <div id="whoAmIChoicesGroup" class="choices-grid hidden">
        <!-- JS에서 4개 버튼 동적 렌더링 -->
      </div>

      <!-- 4. 정답 & 설명 결과창 (선택 후 바로 노출) -->
      <section id="resultSection" class="result-section hidden" aria-live="polite">
        <div class="result-header">
          <span id="resultIcon" class="result-badge-icon">🎉</span>
          <div class="result-title-box">
            <div id="resultVerdictText" class="result-verdict">⭕ 진짜 있는 동물이에요!</div>
            <h3 id="creatureNameHeading" class="creature-name">오리너구리 (Platypus)</h3>
          </div>
        </div>

        <p id="resultFactText" class="result-fact-desc">
          처음 발견됐을 때 과학자들이 "오리 부리를 비버 몸에 꿰맨 가짜다!"라고 의심했던 신비한 호주 동물이에요.
        </p>

        <button type="button" id="btnNext" class="btn-next-big">
          다음 동물 보러가기 👉
        </button>
      </section>

      <!-- 5. 하단 미니 네비게이션 (이전/건너뛰기) -->
      <footer class="footer-nav">
        <button type="button" id="btnPrev" class="nav-text-btn">← 이전</button>
        <button type="button" id="btnSkip" class="nav-text-btn">건너뛰기 →</button>
      </footer>
    </main>
  </div>

  <script src="creatures.js"></script>
  <script src="app.js"></script>
</body>
</html>
